# Optional overrides for /usr/local/sbin/hibernate-prepare.
# Copy to /etc/hibernate-prepare.conf and uncomment what you want to change.

# GPU growth assumed until a larger one is measured (MiB)
#DEFAULT_GROWTH_MIB=3072
# GPU memory in use that the default growth already covers (MiB)
#DEFAULT_VRAM_MIB=1024
# Safety factor on the growth (percent) and fixed margin (MiB)
#GROWTH_FACTOR_PCT=125
#EXTRA_MARGIN_MIB=512
# Time limit for pushing memory to the disk swap (seconds)
#MAX_SECONDS=120
# Desktop notification when hibernation is cancelled (1 = on, 0 = off)
#NOTIFY=1
# Drivers unloaded while hibernating and reloaded after, space separated,
# for hardware that blocks the power-off (example: MediaTek Wi-Fi)
#UNLOAD_MODULES="mt7921e"
# Progress while hibernating: text screen on console PROGRESS_VT and a
# blinking Caps Lock light, back to the desktop after waking up (0 = off)
#PROGRESS=1
#PROGRESS_VT=8
# Experimental: disconnect the power button driver and the built-in keyboard
# controller while hibernating, so stray events from the laptop's controller
# cannot roll the hibernation back (seen on the MSI Bravo 15 C7VF after
# starting hibernation with the power button). 0 = off.
#DETACH_POWER_BUTTON=1
#DETACH_KEYBOARD=1
# USB devices (mice, keyboards, receivers, Bluetooth adapter) and the touchpad
# cannot cancel the hibernation while it runs. 0 = off.
#NO_INPUT_WAKEUP=1
# Hibernated with the lid closed and woken with it open: switch the built-in
# screen back on if it is still off. 0 = off.
#SCREEN_ON_AFTER_LID=1
