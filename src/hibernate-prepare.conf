# Settings for hibernate-prepare (/usr/local/sbin/hibernate-prepare).
#
# Installed as /etc/hibernate-prepare.conf. Every line starting with "#NAME="
# shows the default; remove the "#" and change the value to override it.
# Running the installer again keeps the values you set and refreshes these
# comments (the previous file is kept as /etc/hibernate-prepare.conf.old).
#
# See the current numbers with:   sudo hibernate-prepare status


# === Memory calculation ======================================================
# Before hibernating, memory is pushed to the disk swap until the image plus
# the GPU drivers' growth fits in half of RAM. These numbers set the margins.

# DEFAULT_GROWTH_MIB - memory the GPU drivers are assumed to add while
#   hibernating, until a larger value has been measured on this machine.
#   Values: MiB.   Default: 3072
#   Change it when: you have 8 GB RAM and only one GPU (try 1024-2048, then
#   calibrate); the script keeps the largest measured value anyway.
#DEFAULT_GROWTH_MIB=3072

# DEFAULT_VRAM_MIB - GPU memory in use that the default growth already covers;
#   GPU memory in use above this is added to the allowance.
#   Values: MiB.   Default: 1024
#DEFAULT_VRAM_MIB=1024

# GROWTH_FACTOR_PCT - safety factor on the growth for the target the script
#   aims for (125 = growth + 25 %). Cancelling only uses the plain growth.
#   Values: percent.   Default: 125
#GROWTH_FACTOR_PCT=125

# EXTRA_MARGIN_MIB - fixed extra margin on top of the growth.
#   Values: MiB.   Default: 512
#EXTRA_MARGIN_MIB=512

# RESERVED_MIB - RAM the kernel keeps free for drivers while the devices are
#   frozen (/sys/power/reserved_size). Too small made the AMD driver fail.
#   Values: MiB.   Default: 1024
#RESERVED_MIB=1024

# LIMIT_SLACK_MIB - keep the image this far below half of RAM.
#   Values: MiB.   Default: 256
#LIMIT_SLACK_MIB=256

# IMAGE_RATIO_PCT - expected size of the compressed image on disk compared to
#   memory, used to check that the swap has room. Only an estimate.
#   Values: percent.   Default: 70
#IMAGE_RATIO_PCT=70

# MAX_SECONDS - time limit for pushing memory to the disk swap.
#   Values: seconds.   Default: 120
#   Change it when: you have a slow disk and very much RAM in use.
#MAX_SECONDS=120


# === Messages and progress ===================================================

# NOTIFY - desktop notification when a hibernation is cancelled (with the
#   reason and what to do).
#   Values: 1 = on, 0 = off.   Default: 1
#NOTIFY=1

# PROGRESS - while hibernating, switch to a text screen that shows the progress
#   and let the Caps Lock light blink (until the keyboard is disconnected).
#   Values: 1 = on, 0 = off.   Default: 1
#   Change it when: the screen ever stays on text after waking (Ctrl+Alt+F2
#   brings the desktop back), or you prefer a plain black screen.
#PROGRESS=1

# PROGRESS_VT - text console used for the progress screen.
#   Values: 2-12, not the one your desktop runs on.   Default: 8
#PROGRESS_VT=8


# === Power button and input devices ==========================================
# On the MSI Bravo 15 C7VF, hibernation started with the power button was
# always rolled back right after the image was written (stray keyboard bytes
# and button events from the laptop's controller), and the NVIDIA driver then
# crashed. These settings prevent that.

# DETACH_POWER_BUTTON - disconnect the power-button driver while hibernating
#   and reconnect it after waking. The firmware still powers the laptop on.
#   Values: 1 = on, 0 = off.   Default: 1
#   Change it when: the power button ever stays dead after waking (a restart
#   fixes it); with 0, hibernate from the start menu instead.
#DETACH_POWER_BUTTON=1

# DETACH_KEYBOARD - disconnect the built-in keyboard controller while
#   hibernating and reconnect it after waking. The Caps Lock light then stops
#   blinking once the kernel takes over.
#   Values: 1 = on, 0 = off.   Default: 1
#   Change it when: the built-in keyboard ever stays dead after waking; with 0,
#   hibernate from the start menu instead of the power button.
#DETACH_KEYBOARD=1

# NO_INPUT_WAKEUP - USB devices (mice, keyboards, receivers, the Bluetooth
#   adapter) and the touchpad cannot cancel the hibernation while it runs.
#   Values: 1 = on, 0 = off.   Default: 1
#NO_INPUT_WAKEUP=1


# === Lid and screen ==========================================================

# SCREEN_ON_AFTER_LID - hibernated with the lid closed and woken with it open:
#   switch the built-in screen back on if the desktop left it off.
#   Values: 1 = on, 0 = off.   Default: 1
#   Change it when: you keep the built-in screen switched off on purpose.
#SCREEN_ON_AFTER_LID=1

# MODEL_RUNS - after this many successful hibernations that recorded the GPU
#   memory, the decision "does it fit?" is made from what the graphics driver
#   holds at that moment (it copies that into RAM while freezing) instead of a
#   fixed worst case. The limit is then the largest image that has worked here.
#   Values: a number of runs.   Default: 3
#   Change it when: you want more runs before the learned model is trusted.
#MODEL_RUNS=3

# DIAGNOSE - log what stays in RAM before hibernating (kernel, GPU memory of
#   each graphics card), and after waking how long the devices took to freeze,
#   the slowest ones, and driver warnings; also whether the progress screen's
#   double-size font could be loaded. Costs nothing noticeable.
#   Values: 1 = on, 0 = off.   Default: 1
#   Change it when: hibernation has worked well for a while and the extra log
#   lines are not needed.
#DIAGNOSE=1


# === Drivers =================================================================

# UNLOAD_MODULES - drivers unloaded just before hibernating and loaded again
#   after waking, for hardware that blocks the power-off. Space separated.
#   Values: driver names, for example "mt7921e" (MediaTek Wi-Fi).   Default: ""
#   Not needed on the MSI Bravo 15 C7VF.
#UNLOAD_MODULES=""
