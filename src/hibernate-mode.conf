# Installed as /etc/systemd/sleep.conf.d/hibernate-prepare.conf
# Power off through the firmware (ACPI S4) after the image is written.
# On the MSI Bravo 15 C7VF "shutdown" hangs at the final power-off (black
# screen, orange LED, long-press needed); "platform" powers off cleanly.
# A drop-in wins over HibernateMode= in /etc/systemd/sleep.conf.
[Sleep]
HibernateMode=platform
